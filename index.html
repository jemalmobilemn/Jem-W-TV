<!DOCTYPE html>
<html lang="am" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --panel: #1a1a24;
      --border: #2a2a3a;
      --text: #ffffff;
      --muted: #8888aa;
      --accent: #ff6b35;
      --accent-glow: rgba(255, 107, 53, 0.4);
    }
    [data-theme="light"] {
      --bg: #f0f0f5;
      --panel: #ffffff;
      --border: #d0d0dd;
      --text: #1a1a2e;
      --muted: #666680;
      --accent: #e05520;
      --accent-glow: rgba(224, 85, 32, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .search-box {
      flex: 1;
      min-width: 180px;
      max-width: 400px;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    select {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn:hover, .btn.active { border-color: var(--accent); color: var(--accent); }
    .layout { display: flex; flex: 1; overflow: hidden; }
    .player-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      min-width: 0;
    }
    .video-wrap {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .player-message {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
    }
    .player-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .player-code {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }
    .playlist-panel {
      width: 360px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .playlist-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }
    #channels-playlist { flex: 1; overflow-y: auto; padding: 8px; }
    .playlist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
      font-size: 13px;
    }
    .playlist-item:hover { background: var(--border); }
    .playlist-item.active { background: var(--accent-glow); border-left: 3px solid var(--accent); }
    .playlist-code {
      background: var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }
    .playlist-text { flex: 1; overflow: hidden; }
    .playlist-text strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .playlist-text small { color: var(--muted); font-size: 11px; }
    .play-icon { color: var(--accent); font-size: 12px; flex-shrink: 0; }
    .settings-view { padding: 40px; text-align: center; color: var(--muted); }
    .settings-group {
      max-width: 400px;
      margin: 0 auto 24px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .settings-group h3 { margin-bottom: 16px; font-size: 16px; color: var(--text); }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-row label { font-size: 14px; color: var(--text); }
    .setting-row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }
    .switch.active { background: var(--accent); }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch.active::after { left: 22px; }
    [hidden] { display: none !important; }
    @media (max-width: 800px) {
      .layout { flex-direction: column; }
      .playlist-panel { width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <h1 id="app-title" data-i18n="appTitle">📺 የዓለም ቻናሎች</h1>
  <input id="search-input" class="search-box" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="ቻናል ፈልግ..." />
  <select id="category-filter">
    <option value="all" data-i18n="allCategories">ሁሉም ምድቦች</option>
    <option value="NEWS" data-i18n="categoryNews">ዜና</option>
    <option value="SPORTS" data-i18n="categorySports">ስፖርት</option>
    <option value="ENTERTAINMENT" data-i18n="categoryEntertainment">መዝናኛ</option>
  </select>
  <button id="home-btn" class="btn active" type="button" data-i18n="homeBtn">🏠 ቤት</button>
  <button id="settings-btn" class="btn" type="button" data-i18n="settingsBtn">⚙️ ቅንብሮች</button>
</header>

<div class="layout" id="tv-view">
  <section class="player-section">
    <div class="video-wrap">
      <video id="tv-player" controls playsinline autoplay muted></video>
      <div id="player-message" class="player-message" data-i18n="msgChooseChannel">ቻናል ይምረጡ...</div>
    </div>
    <div class="player-info">
      <span id="playing-code" class="player-code">---</span>
      <div>
        <strong id="playing-title" data-i18n="defaultChannelTitle">ምንም የተመረጠ ቻናል የለም</strong>
        <div id="playing-category" style="font-size:12px;color:var(--muted);"></div>
      </div>
      <span id="player-status" class="status" data-i18n="statusReady">● ዝግጁ</span>
    </div>
  </section>

  <aside class="playlist-panel">
    <div class="playlist-header">
      <span id="channel-count">0</span>
      <span data-i18n="liveStream">የቀጥታ ስርጭት</span>
    </div>
    <div id="channels-playlist"></div>
  </aside>
</div>

<div id="settings-view" class="settings-view" hidden>
  <h2 style="margin-bottom:28px;color:var(--text);" data-i18n="settingsTitle">⚙️ ቅንብሮች</h2>

  <div class="settings-group">
    <h3 data-i18n="settingsAppearance">🎨 መልክ</h3>
    <div class="setting-row">
      <div>
        <label data-i18n="settingsDarkMode">ጨለማ ሁነታ (Dark Mode)</label>
        <small data-i18n="settingsDarkModeDesc">የገጹን ቀለም ወደ ጨለማ ይቀይሩ</small>
      </div>
      <div id="toggle-dark" class="switch active"></div>
    </div>
    <div class="setting-row">
      <div>
        <label data-i18n="settingsLanguage">ቋንቋ (Language)</label>
        <small data-i18n="settingsLanguageDesc">የገጹን ቋንቋ ይምረጡ</small>
      </div>
      <select id="language-select" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);">
        <option value="am">አማርኛ</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="settings-group">
    <h3 data-i18n="settingsPlayer">▶️ አጫዋች</h3>
    <div class="setting-row">
      <div>
        <label data-i18n="settingsAutoplay">ራስ-ሰር ማጫወት (Autoplay)</label>
        <small data-i18n="settingsAutoplayDesc">ገጹ ሲከፈት የመጀመሪያው ቻናል በራስ-ሰር እንዲጫወት</small>
      </div>
      <div id="toggle-autoplay" class="switch active"></div>
    </div>
    <div class="setting-row">
      <div>
        <label data-i18n="settingsLowData">ዝቅተኛ ውሂብ ሁነታ (Low Data)</label>
        <small data-i18n="settingsLowDataDesc">የቪዲዮ ጥራትን በመቀነስ ዳታ ይቆጥቡ</small>
      </div>
      <div id="toggle-lowdata" class="switch"></div>
    </div>
  </div>

  <div class="settings-group">
    <h3 data-i18n="settingsGeneral">🌍 አጠቃላይ</h3>
    <div class="setting-row">
      <div>
        <label data-i18n="settingsDefaultCategory">ነባሪ ምድብ</label>
        <small data-i18n="settingsDefaultCategoryDesc">ሲከፈት የሚታየው የቻናል ምድብ</small>
      </div>
      <select id="default-category" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);">
        <option value="all" data-i18n="settingsAll">ሁሉም</option>
        <option value="NEWS" data-i18n="categoryNews">ዜና</option>
        <option value="SPORTS" data-i18n="categorySports">ስፖርት</option>
        <option value="ENTERTAINMENT" data-i18n="categoryEntertainment">መዝናኛ</option>
      </select>
    </div>
  </div>

  <button id="back-btn" class="btn" type="button" style="margin-top:20px;" data-i18n="backBtn">⬅️ ወደ ቻናሎች ተመለስ</button>
</div>

<script src="app.js"></script>
</body>
</html>
