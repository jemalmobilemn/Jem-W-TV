<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JW Jemal W TV - Live TV</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-jw">JW</span>
      <span class="logo-title">Jemal <span class="highlight">W</span> TV</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="active"><i class="fa-solid fa-tv"></i> Live TV</a>
      <a href="#" id="settings-tab-btn"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
  </header>

  <!-- Main TV Interface Layout -->
  <main class="tv-main-container" id="tv-app-view">
    
    <!-- Player Section -->
    <section class="tv-player-section">
      <div class="tv-screen-wrapper">
        <video id="native-tv-player" controls autoplay playsinline></video>
        <div class="tv-overlay-info" id="tv-watermark">JW LIVE TV</div>
      </div>
      <div class="current-playing-bar">
        <div class="channel-indicator">
          <span id="playing-code" class="p-code">JW</span>
          <div>
            <h2 id="playing-title">ቻናል ይምረጡ</h2>
            <p id="playing-category">Instant Live Streaming</p>
          </div>
        </div>
        <div class="player-status">
          <span class="live-dot"></span> LIVE NOW
        </div>
      </div>
    </section>

    <!-- Channels Directory & Playlist -->
    <section class="tv-sidebar-section">
      <div class="sidebar-header">
        <h3>የቀጥታ ስርጭት ቻናሎች</h3>
        <span id="channel-count">0 ቻናሎች</span>
      </div>

      <!-- Search & Filters -->
      <div class="tv-controls">
        <div class="tv-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="ቻናል ይፈልጉ...">
        </div>
        <select id="category-filter">
          <option value="all">ሁሉም ቻናሎች</option>
          <option value="SPORTS">⚽ ስፖርት (Sports)</option>
          <option value="NEWS">📰 ዜና (News)</option>
          <option value="ENTERTAINMENT">🎬 መዝናኛ (Entertainment)</option>
        </select>
      </div>

      <!-- Channels List -->
      <div class="channels-playlist" id="channels-playlist"></div>
    </section>
  </main>

  <!-- Settings View -->
  <section class="settings-container" id="settings-view" style="display: none;">
    <div class="settings-card">
      <h2><i class="fa-solid fa-gear"></i> የአፕ ማስተካከያ (Settings)</h2>
      
      <div class="setting-item">
        <div>
          <h4>Dark Mode / Light Mode</h4>
          <p>ገጽታውን መቀየር</p>
        </div>
        <button id="theme-toggle-btn" class="btn-theme-toggle">
          <i class="fa-solid fa-moon"></i> Dark Theme
        </button>
      </div>

      <button class="btn-primary" id="back-to-tv-btn"><i class="fa-solid fa-arrow-left"></i> ወደ ቲቪ ተመለስ</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
