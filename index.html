<!DOCTYPE html>
<html lang="am" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>JW Jemal W TV - Live World & Sports TV</title>

  <link rel="stylesheet" href="styles.css">

  <!-- HLS support for instant streaming -->
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <span class="logo-jw">JW</span>
      <span>Jemal <b class="highlight">W</b> TV</span>
    </div>

    <nav>
      <button id="home-btn" class="nav-btn active">📺 Live TV & Sports</button>
      <button id="settings-btn" class="nav-btn">⚙️ Settings</button>
    </nav>
  </header>

  <main id="tv-view" class="tv-main-container">

    <section class="player-section">
      <div class="tv-screen-wrapper">
        <video id="tv-player"
          controls
          playsinline
          webkit-playsinline
          preload="auto">
        </video>
        <div class="watermark">JW LIVE TV</div>
      </div>

      <div class="current-playing-bar">
        <div class="channel-indicator">
          <span id="playing-code" class="p-code">JW</span>
          <div>
            <h2 id="playing-title">ቻናል ይምረጡ</h2>
            <p id="playing-category">Al Jazeera, Sports & Global TV Live</p>
          </div>
        </div>
        <span id="player-status" class="player-status">● READY</span>
      </div>

      <p id="player-message" class="player-message" role="status" aria-live="polite">
        ለመጀመር ከዝርዝሩ ውስጥ ቻናል ይምረጡ።
      </p>

      <button id="retry-btn" class="primary-btn">↻ እንደገና ሞክር</button>
    </section>

    <section class="sidebar">
      <div class="sidebar-header">
        <h2>ስፖርት እና የዓለም ቻናሎች</h2>
        <span id="channel-count">2000+ ቻናሎች</span>
      </div>

      <div class="tv-controls">
        <input id="search-input" type="search" placeholder="ቻናል, አልጀዚራ, ስፖርት ይፈልጉ...">

        <select id="category-filter">
          <option value="all">ሁሉም ቻናሎች (2000+)</option>
          <option value="SPORTS">⚽ ስፖርት (Sports & Leagues)</option>
          <option value="NEWS">📰 ዜና (Al Jazeera, BBC, DW)</option>
          <option value="ENTERTAINMENT">🎬 መዝናኛ (Entertainment)</option>
        </select>
      </div>

      <div id="channels-playlist" class="channels-playlist"></div>
    </section>

  </main>

  <main id="settings-view" class="settings-container" hidden>
    <section class="settings-card">
      <h2>⚙️ የአፕ ማስተካከያ</h2>

      <div class="setting-item">
        <div>
          <h3>Dark / Light Mode</h3>
          <p>የገጹን ገጽታ ቀይር</p>
        </div>
        <button id="theme-toggle" class="primary-btn">☀️ / 🌙</button>
      </div>

      <div class="setting-item">
        <div>
          <h3>Stream Engine</h3>
          <p>HTML5 & HLS Fast Stream Optimizer</p>
        </div>
        <span style="color:#22c55e; font-weight:bold;">Active</span>
      </div>

      <button id="back-btn" class="primary-btn">← ወደ TV ተመለስ</button>
    </section>
  </main>

  <footer>JW Jemal W TV Pro v6.0</footer>

</body>
</html>
