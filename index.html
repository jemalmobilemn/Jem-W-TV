<!DOCTYPE html>
<html lang="am" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV የዓለም ቻናሎች</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0f0f13;
      --panel: #1a1a24;
      --border: #2a2a3a;
      --text: #ffffff;
      --muted: #8888aa;
      --accent: #ff6b35;
      --accent-glow: rgba(255, 107, 53, 0.4);
    }
    [data-theme="light"] {
      --bg: #f0f0f5;
      --panel: #ffffff;
      --border: #d0d0dd;
      --text: #1a1a2e;
      --muted: #666680;
      --accent: #e05520;
      --accent-glow: rgba(224, 85, 32, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .search-box {
      flex: 1;
      min-width: 180px;
      max-width: 400px;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    select {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn:hover, .btn.active { border-color: var(--accent); color: var(--accent); }
    .layout { display: flex; flex: 1; overflow: hidden; }
    .player-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      min-width: 0;
    }
    .video-wrap {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .player-message {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
    }
    .player-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .player-code {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }
    .playlist-panel {
      width: 360px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .playlist-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }
    #channels-playlist { flex: 1; overflow-y: auto; padding: 8px; }
    .playlist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
      font-size: 13px;
    }
    .playlist-item:hover { background: var(--border); }
    .playlist-item.active { background: var(--accent-glow); border-left: 3px solid var(--accent); }
    .playlist-code {
      background: var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }
    .playlist-text { flex: 1; overflow: hidden; }
    .playlist-text strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .playlist-text small { color: var(--muted); font-size: 11px; }
    .play-icon { color: var(--accent); font-size: 12px; flex-shrink: 0; }
    .settings-view { padding: 40px; text-align: center; color: var(--muted); }
    [hidden] { display: none !important; }
    @media (max-width: 800px) {
      .layout { flex-direction: column; }
      .playlist-panel { width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <h1>📺 የዓለም ቻናሎች</h1>
  <input id="search-input" class="search-box" type="search" placeholder="ቻናል ፈልግ..." />
  <select id="category-filter">
    <option value="all">ሁሉም ምድቦች</option>
    <option value="NEWS">ዜና</option>
    <option value="SPORTS">ስፖርት</option>
    <option value="ENTERTAINMENT">መዝናኛ</option>
  </select>
  <button id="home-btn" class="btn active" type="button">🏠 ቤት</button>
  <button id="settings-btn" class="btn" type="button">⚙️ ቅንብሮች</button>
  <button id="theme-toggle" class="btn" type="button">🌓</button>
</header>

<div class="layout" id="tv-view">
  <section class="player-section">
    <div class="video-wrap">
      <video id="tv-player" controls playsinline autoplay muted></video>
      <div id="player-message" class="player-message">ቻናል ይምረጡ...</div>
    </div>
    <div class="player-info">
      <span id="playing-code" class="player-code">---</span>
      <div>
        <strong id="playing-title">ምንም የተመረጠ ቻናል የለም</strong>
        <div id="playing-category" style="font-size:12px;color:var(--muted);"></div>
      </div>
      <span id="player-status" class="status">● ዝግጁ</span>
    </div>
  </section>

  <aside class="playlist-panel">
    <div class="playlist-header">
      <span id="channel-count">0 ቻናሎች</span>
      <span>የቀጥታ ስርጭት</span>
    </div>
    <div id="channels-playlist"></div>
  </aside>
</div>

<div id="settings-view" class="settings-view" hidden>
  <h2>⚙️ ቅንብሮች</h2>
  <p>ይህ የማሳያ ቅንብር ነው።</p>
  <button id="back-btn" class="btn" type="button">⬅️ ወደ ቻናሎች ተመለስ</button>
</div>

<script src="app.js"></script>
</body>
</html>
